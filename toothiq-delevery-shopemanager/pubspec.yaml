name: toothiq_shop_manager
description: "ToothIQ Partner — لوحة المتاجر ومندوبي التوصيل."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_screenutil: ^5.9.0
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  custom_refresh_indicator: ^4.0.1
  image_picker: ^1.2.3
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon/toothiqlogo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon/toothiqlogo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icon/
    - assets/categaryicon/

  fonts:
    - family: Expo Arabic
      fonts:
        - asset: assets/fonts/ExpoArabic-Book.ttf
